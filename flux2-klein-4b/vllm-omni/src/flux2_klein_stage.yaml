stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      # Single-core default — 4B fits in the 24GB user budget.
      # Bump to "0,1" / "0,1,2,3" for TP=2 / TP=4 throughput experiments.
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_class_name: Flux2KleinPipeline
      model_stage: diffusion
      dtype: bfloat16
      skip_warmup: true
      parallel_config:
        tensor_parallel_size: 1
